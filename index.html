<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三賢宮 LINE 輪播分享</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f7f5f1;color:#29241e;margin:0}main{max-width:650px;margin:auto;padding:22px}h1{font-size:25px}label{display:block;margin-top:14px;font-weight:600}input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cfc8be;border-radius:9px;font:inherit}textarea{min-height:70px}.card{background:white;border:1px solid #ddd4c8;border-radius:12px;padding:16px;margin:15px 0}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{border:0;border-radius:9px;background:#6b3327;color:white;padding:12px 15px;font-weight:600}button.secondary{background:#e7ded3;color:#352820}.note{font-size:13px;color:#665c53;line-height:1.6}#status{white-space:pre-wrap}img.preview{max-width:100%;max-height:200px;object-fit:contain;margin-top:10px}</style></head><body><main><h1>三賢宮｜LINE 輪播卡片分享</h1><p class="note">管理卡片後按「分享至 LINE」。資料暫存於目前瀏覽器，換裝置或清除瀏覽資料可能遺失。圖片必須是公開 HTTPS 圖片網址（不能使用手機本機路徑）。</p><label>LINE LIFF ID</label><input id="liffId" placeholder="例如 1234567890-AbCdEfGh"><label>三賢宮官方帳號連結</label><input id="oa" placeholder="https://line.me/R/ti/p/@你的官方帳號ID"><div id="cards"></div><div class="buttons"><button class="secondary" id="add">＋新增卡片</button><button class="secondary" id="save">儲存設定</button><button id="share">分享至 LINE</button></div><p id="status" class="note"></p></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const $=id=>document.getElementById(id);const defaults={liffId:'',oa:'',cards:[{title:'石府元帥祝壽宮慶',description:'12月5日降塵濟世紀念日',image:''},{title:'千香千箱・捐香護持',description:'一炷清香傳善念',image:''}]};let state;try{state=JSON.parse(localStorage.getItem('sanxian-carousel-v1'))||structuredClone(defaults)}catch(e){state=structuredClone(defaults)};state.cards=Array.isArray(state.cards)?state.cards:[];$('liffId').value=state.liffId||'';$('oa').value=state.oa||'';
function field(label,value,onchange){const wrap=document.createElement('label');wrap.textContent=label;const inp=document.createElement('input');inp.value=value||'';inp.addEventListener('input',()=>onchange(inp.value));wrap.appendChild(inp);return wrap}
function render(){const root=$('cards');root.replaceChildren();state.cards.forEach((c,i)=>{const box=document.createElement('section');box.className='card';const head=document.createElement('strong');head.textContent=`第 ${i+1} 張卡片`;box.appendChild(head);box.appendChild(field('標題',c.title,v=>c.title=v));box.appendChild(field('介紹文字',c.description,v=>c.description=v));box.appendChild(field('公開圖片 HTTPS 網址',c.image,v=>c.image=v));const buttons=document.createElement('div');buttons.className='buttons';[['上移',()=>{if(i>0){[state.cards[i-1],state.cards[i]]=[state.cards[i],state.cards[i-1]];render()}}],['下移',()=>{if(i<state.cards.length-1){[state.cards[i+1],state.cards[i]]=[state.cards[i],state.cards[i+1]];render()}}],['刪除',()=>{state.cards.splice(i,1);render()}]].forEach(([name,fn])=>{const b=document.createElement('button');b.className='secondary';b.textContent=name;b.onclick=fn;buttons.appendChild(b)});box.appendChild(buttons);root.appendChild(box)})}
function persist(){state.liffId=$('liffId').value.trim();state.oa=$('oa').value.trim();localStorage.setItem('sanxian-carousel-v1',JSON.stringify(state));$('status').textContent='已儲存於目前瀏覽器。'}
$('add').onclick=()=>{if(state.cards.length>=10){$('status').textContent='最多 10 張卡片';return}state.cards.push({title:'新卡片',description:'活動介紹',image:''});render()};$('save').onclick=persist;
function httpsUrl(value){try{const u=new URL(value);return u.protocol==='https:'}catch{return false}}
$('share').onclick=async()=>{persist();const status=$('status');if(!/^\d+-[\w-]+$/.test(state.liffId)){status.textContent='請先填入正確的 LIFF ID。';return}if(!httpsUrl(state.oa)){status.textContent='請填入有效的 LINE 官方帳號 HTTPS 連結。';return}if(state.cards.length===0||state.cards.length>10||state.cards.some(c=>!c.title.trim()||!httpsUrl(c.image))){status.textContent='請設定 1–10 張卡片，每張都要有標題和公開 HTTPS 圖片網址。';return}try{status.textContent='正在連接 LINE…';await liff.init({liffId:state.liffId});if(!liff.isInClient()){status.textContent='請透過 LINE App 開啟此 LIFF 網址後再分享。';return}if(!liff.isApiAvailable('shareTargetPicker')){status.textContent='目前環境無法使用分享選擇器，請確認 LIFF 的 chat_message.write 權限及 LINE 版本。';return}const bubbles=state.cards.map(c=>({type:'bubble',hero:{type:'image',url:c.image,size:'full',aspectRatio:'1:1',aspectMode:'cover',action:{type:'uri',uri:state.oa}},body:{type:'box',layout:'vertical',contents:[{type:'text',text:c.title,weight:'bold',wrap:true,size:'lg'},...(c.description?[{type:'text',text:c.description,wrap:true,size:'sm',color:'#666666',margin:'md'}]:[])]},footer:{type:'box',layout:'vertical',contents:[{type:'button',style:'primary',color:'#6b3327',action:{type:'uri',label:'聯絡三賢宮',uri:state.oa}}]}}));const result=await liff.shareTargetPicker([{type:'flex',altText:'三賢宮活動資訊',contents:{type:'carousel',contents:bubbles}}]);status.textContent=result?'已完成 LINE 分享操作。':'分享視窗已關閉或未完成分享。'}catch(e){status.textContent='分享失敗：'+(e?.message||String(e))}};render();
</script></body></html>
